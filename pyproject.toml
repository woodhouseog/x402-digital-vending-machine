[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-cleanup-client"
version = "1.0.0"
description = "One-line Solana USDC x402 client for paid text normalization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "base58>=2.1.1,<3",
  "requests>=2.32,<3",
  "x402[requests,svm]>=2,<3",
]

[project.urls]
Homepage = "https://www.x402digitalvendingmachine.store/"
Repository = "https://github.com/woodhouseog/x402-digital-vending-machine"
Documentation = "https://www.x402digitalvendingmachine.store/openapi.json"

[project.scripts]
x402-cleanup = "scripts.x402_client_sdk:main"

[tool.setuptools]
packages = ["x402_cleanup", "scripts"]
